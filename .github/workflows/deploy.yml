# main ブランチで検証済みのコミットだけを Cloudflare Workers へ反映する。
name: Deploy production

on:
  push:
    branches: [main]
  # 障害復旧時に、対象コミットから同じ手順を手動で再実行できるようにする。
  workflow_dispatch:

# リポジトリ内容の読み取り以外の GitHub 権限は付与しない。
permissions:
  contents: read

# migration とデプロイが並行しないよう、後続実行を待機させる。
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # lockfile と完全に一致する依存関係だけを利用する。
      - name: Install dependencies
        run: npm ci

      # migration や本番反映の前に、ローカルで再現可能な全検査を通す。
      - name: Run checks
        run: npm run check

      # Worker より先に前方互換な migration を適用し、新旧コードの双方が動く状態にする。
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply discord-ai-bot --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # package-lock.json で固定した Wrangler から、同じコミットの Worker を公開する。
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
